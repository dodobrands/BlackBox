name: Unit Tests

on:
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: xcode-27

    timeout-minutes: 10

    env:
      SCHEME: "BlackBox"

    strategy:
      matrix:
        DESTINATION: ["platform=iOS Simulator,name=iPhone 17", "platform=OS X", "platform=tvOS Simulator,name=Apple TV 4K (3rd generation)", "platform=watchOS Simulator,name=Apple Watch Ultra 4 (49mm)"]

    steps:
    - name: Get source code
      uses: actions/checkout@v7

    - name: Prepare Environment for App Build
      uses: ./.github/actions/prepare_env_app_build

    - name: Build
      run: |
        xcodebuild build-for-testing \
        -scheme ${{ env.SCHEME }} \
        -destination "${{ matrix.DESTINATION }}" \
        -quiet

    - name: Test
      id: test
      run: |
        xcresult="${{ env.SCHEME }}-${{ matrix.DESTINATION }}.xcresult"
        xcodebuild test-without-building \
        -scheme ${{ env.SCHEME }} \
        -destination "${{ matrix.DESTINATION }}" \
        -resultBundlePath "$xcresult" \
        -quiet

        echo "xcresult=$xcresult" >> $GITHUB_OUTPUT

    - uses: actions/upload-artifact@v7
      with:
        path: "${{ steps.test.outputs.xcresult }}"
        name: "${{ steps.test.outputs.xcresult }}"

  # This allows us to have a branch protection rule for tests and deploys with matrix
  status-for-matrix:
    runs-on: 'ubuntu-latest'
    needs: tests
    if: always()
    steps:
      - name: Calculate matrix result
        run: |
          result="${{ needs.tests.result }}"
          if [[ $result == "success" ]]; then
            exit 0
          else
            exit 1
          fi
